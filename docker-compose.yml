version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: goldencity-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: goldencity
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - goldencity-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goldencity-backend
    restart: unless-stopped
    environment:
      - PORT=5001
      - DB_URI=mongodb://mongodb:27017/goldencity
      - JWT_SECRET=development-secret-change-in-production
      - NODE_ENV=development
    ports:
      - "5001:5001"
    depends_on:
      - mongodb
    networks:
      - goldencity-network

volumes:
  mongodb_data:

networks:
  goldencity-network:
    driver: bridge
